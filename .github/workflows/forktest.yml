name: fork-pr-injection-test
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRUSTED_CONTROL_VAR: safe-default
    steps:
      - name: Write PR body into GITHUB_ENV via simple single-line syntax
        run: |
          echo "PR_INFO=${{ github.event.pull_request.body }}" >> "$GITHUB_ENV"
      - name: Show env state
        run: |
          echo "TRUSTED_CONTROL_VAR: [$TRUSTED_CONTROL_VAR]"
      - name: GATED STEP - should NEVER run unless TRUSTED_CONTROL_VAR was tampered with
        if: env.TRUSTED_CONTROL_VAR != 'safe-default'
        run: |
          echo "!!! THIS STEP WAS GATED BEHIND an if: CONDITION AND RAN ANYWAY !!!"
          echo "This step stands in for a real privileged action (e.g. a deploy step, or a step guarded 'only run for trusted context')."
      - name: CONTROL STEP - should always run, sanity check the if: mechanism itself works
        if: env.TRUSTED_CONTROL_VAR == 'this-will-never-match-anything'
        run: |
          echo "this should never print"
